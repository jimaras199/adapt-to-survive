name: C++ Build and Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"

          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $manifest.'builtin-baseline'

          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio with MSVC tools not found"
          }

          $beforePath = $env:PATH -split ';'

          Import-Module (Join-Path $vs "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")

          Enter-VsDevShell -VsInstallPath $vs `
            -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC compiler initialization failed"
          }

          $env:PATH -split ';' |
            Where-Object { $_ -and $beforePath -notcontains $_ } |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          foreach ($name in @('INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build/ci `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build/ci --config Release

      - name: Run tests
        run: ctest --test-dir build/ci -C Release --output-on-failure