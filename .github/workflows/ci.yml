name: C++ Build and Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"

          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $manifest.'builtin-baseline'

          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build/ci `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build/ci --config Release

      - name: Run tests
        run: ctest --test-dir build/ci -C Release --output-on-failure